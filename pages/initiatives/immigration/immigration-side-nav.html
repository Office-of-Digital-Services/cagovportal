<div class="col-12 col-lg-3 pb-lg-5 sticky-6 h-100 p-b-md px-0">
  <!-- Side navigation -->
  <details
    class="side-navigation-toggle"
    aria-label="Toggle side navigation"
    aria-expanded="false"
    aria-controls="side-nav-content">
    <summary>
      <span class="container d-block">Immigration and families</span>
    </summary>
  </details>
  <div class="container" id="side-nav-content">
    <nav class="side-navigation sticky-6">
      <a href="javascript:;" aria-hidden="true" class="d-none">{{title}}</a>
      <ul class="list-navigation">
        <li>
          <a href="/support/" class="nav-heading landing back"
            ><span class="sr-only">Back to </span>
            Get help
          </a>
        </li>
        <li>
          <a href="/immigration/" class="nav-heading"
            ><span class="sr-only">Back to </span>
            Immigration
          </a>
          <ul>
            {%- for slug,title in pages | sortBy("featureOrder") %} {%- set href
            = "/immigration/"+slug+"/" -%} {%- set active = href === page.url
            -%}
            <li>
              <a
                href="{{-href-}}"
                {%-if
                active%}
                class="active landing"
                aria-current="page"
                tabindex="-1"
                {%-endif-%}>
                {{-title-}}
              </a>
            </li>
            {%- endfor %}
          </ul>
        </li>
      </ul>
    </nav>
  </div>
</div>
